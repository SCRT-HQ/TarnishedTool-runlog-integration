# Build the tool, check the protocol, and cut a release when asked.
#
# The build runs on every push and pull request and produces the one file
# anybody downloads. The release is a separate job that only runs when
# somebody asks for it by hand, and it names an environment, so a reviewer
# on that environment approves before a tag or a download appears. With no
# reviewers configured on the environment there is no gate at all; see
# .github/workflows/README.md.
name: Build

on:
  push:
    branches: [integration, master]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Cut a release from this build
        type: boolean
        default: false
      tag:
        description: "Tag for the release, e.g. v1.2.1-control.1"
        type: string
      notes:
        description: What changed, in a line or two
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    env:
      # Read in the `if` of the signing step below. A build without the
      # secret, a pull request from a fork, anybody's checkout, produces
      # the same unsigned executable it always did rather than a failure.
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7

      # Every artifact downloads as a zip named after itself, so a fixed
      # name leaves a folder of TarnishedTool (1).zip through (9) with
      # nothing to tell them apart. The minute it was built does that.
      - name: Name this build
        id: name
        shell: pwsh
        run: |
          # UTC, said out loud, because a runner is always UTC and a
          # build made in the evening otherwise downloads dated tomorrow.
          $stamp = [datetime]::UtcNow.ToString("yyyyMMdd-HHmm") + "Z"
          "artifact=TarnishedTool-$stamp" >> $env:GITHUB_OUTPUT
          Write-Host "This build downloads as TarnishedTool-$stamp.zip"

      - uses: microsoft/setup-msbuild@v3
      - uses: NuGet/setup-nuget@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # packages.config rather than PackageReference, so restoring is
      # nuget's job and not msbuild's.
      - name: Restore
        run: nuget restore TarnishedTool.sln

      - name: Build
        run: msbuild TarnishedTool.sln -t:build -p:Configuration=Release -m -v:minimal

      # The only part of the tool that can be checked on a machine with no
      # copy of the game: the wire format, and the registry that reads it.
      - name: Check the protocol
        run: dotnet run --project tests/ProtocolChecks.csproj -c Release

      # Costura packs every dependency into the executable. If that ever
      # stops happening the download quietly becomes one that does not run
      # on anybody else's machine, and the size is what says so.
      - name: One file, and a plausible one
        shell: pwsh
        run: |
          $exe = "TarnishedTool/bin/Release/TarnishedTool.exe"
          if (-not (Test-Path $exe)) { throw "no executable was produced" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Host "TarnishedTool.exe is $mb MB"
          if ($mb -lt 4) { throw "$mb MB is too small: the dependencies are probably not packed in" }

      # Signing, which is a key on somebody else's hardware.
      #
      # Not to get past SmartScreen, though it helps there in time. The
      # reason is Defender: it quarantines the tool when it attaches,
      # because writing another process's memory is what it watches for,
      # and no signature stops a behavior rule. What a signature changes is
      # what Microsoft can do about it. A false-positive submission for an
      # unsigned file is allowed by hash, which covers one build; for a
      # signed one it can be allowed by publisher, which covers every build
      # after it. So this is the thing that makes the fix stick.
      #
      # Azure rather than SignPath, whose GitHub integration is built on
      # trusted build systems and is not on the free plan. This signs the
      # file in place, so there is no artifact to hand over and take back.
      - name: Sign
        if: env.AZURE_CLIENT_SECRET != ''
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          # Both are region-specific and have to match where the signing
          # account was made, which is the usual first thing to be wrong.
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\TarnishedTool\bin\Release\TarnishedTool.exe

      # A signing step that silently produced nothing would ship an
      # unsigned build under a release that says it is signed, and the
      # place that is discovered is a tester's antivirus.
      - name: The file anybody downloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item TarnishedTool/bin/Release/TarnishedTool.exe out/
          if (-not $env:AZURE_CLIENT_SECRET) {
            Write-Host "Unsigned: no signing secret on this build."
            exit 0
          }
          $sig = Get-AuthenticodeSignature out/TarnishedTool.exe
          Write-Host "Signature: $($sig.Status)"
          if ($sig.Status -ne "Valid") { throw "signing was asked for and the file came back $($sig.Status)" }
          Write-Host "Signed by: $($sig.SignerCertificate.Subject)"
          if (-not $sig.TimeStamperCertificate) {
            throw "no timestamp: every signature made with this key goes invalid the day it expires"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: out/TarnishedTool.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The gate. A reviewer on this environment approves before anything is
    # tagged or published.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Everything somebody typed into the dispatch form reaches these
      # steps as an environment variable rather than being pasted into the
      # script. An expression is substituted before the shell sees the
      # line, so a tag or a note could otherwise carry anything it liked.
      - name: A tag is required
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "Give a tag when asking for a release, such as v1.2.1-control.1." >&2
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: out

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          printf '%s\n\n' "$NOTES" > notes.md
          {
            printf 'Built from `%s` on `%s`.\n\n' "$SHA" "$REF"
            printf 'A fork of [borgCode/TarnishedTool](https://github.com/borgCode/TarnishedTool) with a Control tab added. Everything upstream says about offline use applies here: the game goes offline, or you get banned.\n\n'
            printf 'Driving it from something of your own: [docs/controlling.md](https://github.com/%s/blob/%s/docs/controlling.md).\n' "$REPO" "$SHA"
          } >> notes.md
          gh release create "$TAG" out/TarnishedTool.exe \
            --repo "$REPO" \
            --target "$SHA" \
            --title "$TAG" \
            --notes-file notes.md
